name: GitHub-Profile-Dashboard-Assets

on:
  schedule:
    # Runs at 06:00 & 18:00 UTC -> generators flip the palette to match GMT day/night.
    - cron: "0 6,18 * * *"
  workflow_dispatch:
    inputs:
      theme:
        description: "Palette to generate (auto = by current UTC hour)"
        type: choice
        default: auto
        options:
          - auto
          - day
          - night

permissions:
  contents: write

concurrency:
  group: profile-dashboard-assets
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-dashboard-assets
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # 1. Generate 3D contribution graph
      - uses: yoshi389111/github-profile-3d-contrib@0.7.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      # 1b. Keep only the variants the README actually uses (less churn/clutter)
      - name: Trim unused 3D contribution variants
        run: |
          rm -f profile-3d-contrib/profile-gitblock.svg
          rm -f profile-3d-contrib/profile-green.svg
          rm -f profile-3d-contrib/profile-green-animate.svg
          rm -f profile-3d-contrib/profile-night-green.svg
          rm -f profile-3d-contrib/profile-night-view.svg
          rm -f profile-3d-contrib/profile-season.svg
          rm -f profile-3d-contrib/profile-season-animate.svg
          rm -f profile-3d-contrib/profile-south-season.svg
          rm -f profile-3d-contrib/profile-south-season-animate.svg

      # 2. Set up Python and run our custom asset generators
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Generate custom dashboard SVGs
        env:
          # Uses a user PAT if provided (more permissive for GraphQL user
          # contribution data), otherwise falls back to the automatic token.
          GITHUB_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          # 'auto' (scheduled runs) picks the palette by current UTC hour.
          THEME: ${{ github.event.inputs.theme || 'auto' }}
        run: |
          python generate_banner.py
          python generate_assets.py
          python generate_stats.py
          python generate_typing.py
          python generate_achievements.py
          python generate_activity.py
          python generate_featured.py
          python generate_isocalendar.py
          python generate_system_status.py
          python generate_pinned.py

      # 3. Generate Snake Contribution game SVG with custom colors
      - name: Generate github-contribution-grid-snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            profile-3d-contrib/github-contribution-grid-snake.svg?color_snake=#ff79c6&color_dots=#16161e,#3d59a1,#7aa2f7,#bb9af3,#ff79c6
            profile-3d-contrib/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#ff79c6&color_dots=#16161e,#3d59a1,#7aa2f7,#bb9af3,#ff79c6

      # 4. Commit and Push all generated assets
      - name: Commit & Push
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A profile-3d-contrib banner.svg
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update profile dashboard assets" && git push)
