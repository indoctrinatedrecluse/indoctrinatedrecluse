<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 102" width="650" height="102">
  <defs>
    <filter id="termGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#38bdf8" flood-opacity="0.15" />
    </filter>
  </defs>

  <style>
    .mono {
      font-family: 'Fira Code', 'Courier New', monospace;
    }
  </style>

  <!-- Card Background -->
  <rect x="2" y="2" width="646" height="98" rx="12" fill="#0d111a" stroke="#38bdf8" stroke-width="2" filter="url(#termGlow)" />

  <!-- Window Header Bar -->
  <path d="M 2,14 A 12,12 0 0,1 14,2 L 636,2 A 12,12 0 0,1 648,14 L 648,26 L 2,26 Z" fill="#38bdf8" />
  <text x="14" y="18" class="mono" font-size="11" font-weight="bold" fill="#0b0e14">root@indoctrinatedrecluse:~ (identity.protocol)</text>
  
  <circle cx="602" cy="14" r="4.5" fill="#ff5f56" />
  <circle cx="618" cy="14" r="4.5" fill="#ffbd2e" />
  <circle cx="634" cy="14" r="4.5" fill="#27c93f" />

  <!-- Top-Right Action Badge -->
  <g transform="translate(500, 34)">
    <rect x="0" y="0" width="136" height="20" rx="4" fill="#16161e" stroke="#bb9af3" stroke-width="1" />
    <text x="68" y="14" text-anchor="middle" class="mono" font-size="8.5" font-weight="bold" fill="#bb9af3">GITHUB PROFILE &#x2197;</text>
  </g>

  <!-- Body Content -->
  <g class="mono" font-size="12" font-weight="bold">
    <g transform="translate(18, 50)">
      <text x="0" y="0" fill="#c0caf5">&gt; Name:</text>
      <text x="96" y="0" fill="#ff79c6">Abhishek Mitra</text>
    </g>
    <g transform="translate(18, 71)">
      <text x="0" y="0" fill="#c0caf5">&gt; Alias:</text>
      <text x="96" y="0" fill="#bb9af3">@indoctrinatedrecluse &#x2197;</text>
    </g>
    <g transform="translate(18, 92)">
      <text x="0" y="0" fill="#c0caf5">&gt; Role :</text>
      <text x="96" y="0" fill="#4ade80">Full Stack Developer // Software Engineering</text>
    </g>
  </g>
</svg>
