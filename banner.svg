<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" width="1000" height="360">
  <defs>
    <!-- Frame Clip -->
    <clipPath id="frameClip"><rect x="10" y="10" width="980" height="340" rx="20" /></clipPath>

    <!-- Glowing Frame Gradient -->
    <linearGradient id="neonFrame" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="45%" stop-color="#ff79c6" />
      <stop offset="100%" stop-color="#bb9af3" />
    </linearGradient>

    <!-- Scanline Gradient -->
    <linearGradient id="scanlineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0" />
      <stop offset="25%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#ff79c6" stop-opacity="1" />
      <stop offset="75%" stop-color="#bb9af3" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#bb9af3" stop-opacity="0" />
    </linearGradient>

    <!-- ASCII Face Gradients -->
    <linearGradient id="faceGradDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="40%" stop-color="#c0caf5" />
      <stop offset="75%" stop-color="#ff79c6" />
      <stop offset="100%" stop-color="#bb9af3" />
    </linearGradient>
    <linearGradient id="faceGradLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="40%" stop-color="#1e293b" />
      <stop offset="75%" stop-color="#c0267f" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="frameGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="termGlowDark" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#38bdf8" flood-opacity="0.18" />
    </filter>
    <filter id="termGlowLight" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0284c7" flood-opacity="0.12" />
    </filter>
  </defs>

  <style>
    .ascii-text {
      font-family: 'Fira Code', 'Courier New', monospace;
      font-size: 9.3px;
      font-weight: 600;
      letter-spacing: 0px;
      white-space: pre;
    }
    .term-text {
      font-family: 'Fira Code', 'Courier New', monospace;
      font-size: 15px;
      font-weight: bold;
    }
    .term-link {
      text-decoration: none;
      cursor: pointer;
      transition: opacity 0.2s ease;
    }
    .term-link:hover {
      opacity: 0.8;
      text-decoration: underline;
    }
  </style>

  <!-- Canvas Background -->
  <rect x="0" y="0" width="1000" height="360" rx="24" fill="#0b0e14" />

  <!-- Inner Clipped Content -->
  <g clip-path="url(#frameClip)">
    <!-- LEFT SIDE: ASCII Character Art Portrait -->
    <g class="ascii-text">
    <text x="26" y="42.0"><tspan fill="#1e2438">------------------</tspan><tspan fill="url(#faceGradDark)">=%@@@@@@@@#</tspan><tspan fill="#1e2438">------------------------</tspan></text>
    <text x="26" y="51.8"><tspan fill="#1e2438">-------------</tspan><tspan fill="url(#faceGradDark)">+@@@@@####****%@@@=</tspan><tspan fill="#1e2438">:-------------------</tspan></text>
    <text x="26" y="61.6"><tspan fill="#1e2438">------------</tspan><tspan fill="url(#faceGradDark)">+@@@#*+++++++#@@#</tspan><tspan fill="#1e2438">-----------------------</tspan></text>
    <text x="26" y="71.4"><tspan fill="#1e2438">-----------</tspan><tspan fill="url(#faceGradDark)">=#%*++=========#@@#=</tspan><tspan fill="#1e2438">:--------------------</tspan></text>
    <text x="26" y="81.2"><tspan fill="#1e2438">-----------</tspan><tspan fill="url(#faceGradDark)">@%*+++==========*@@%</tspan><tspan fill="#1e2438">:::::::::::::::::::::</tspan></text>
    <text x="26" y="91.0"><tspan fill="#1e2438">----------</tspan><tspan fill="url(#faceGradDark)">%@#+++============*@@#</tspan><tspan fill="#1e2438">::::::::::::::::::::</tspan></text>
    <text x="26" y="100.8"><tspan fill="#1e2438">---------</tspan><tspan fill="url(#faceGradDark)">#*++*%@@====*#%#*=+@#</tspan><tspan fill="#1e2438">::::::::::::::::::::::</tspan></text>
    <text x="26" y="110.6"><tspan fill="#1e2438">--------</tspan><tspan fill="url(#faceGradDark)">+#**%@@@*==#%#***+#*+</tspan><tspan fill="#1e2438">:::::::::::::::::::::::</tspan></text>
    <text x="26" y="120.4"><tspan fill="#1e2438">-------</tspan><tspan fill="url(#faceGradDark)">#=**+#%##===#%***+*+</tspan><tspan fill="#1e2438">:::::::::::::::::::::::::</tspan></text>
    <text x="26" y="130.2"><tspan fill="#1e2438">-------</tspan><tspan fill="url(#faceGradDark)">=***%###=</tspan><tspan fill="#1e2438">-</tspan><tspan fill="url(#faceGradDark)">=*#*==+*</tspan><tspan fill="#1e2438">:::::::::::::::::::::::::::</tspan></text>
    <text x="26" y="140.0"><tspan fill="#1e2438">-------</tspan><tspan fill="url(#faceGradDark)">=**%%**=</tspan><tspan fill="#1e2438">-</tspan><tspan fill="url(#faceGradDark)">=##*==++</tspan><tspan fill="#1e2438">----------------------------</tspan></text>
    <text x="26" y="149.8"><tspan fill="#1e2438">-------</tspan><tspan fill="url(#faceGradDark)">+*##%#*==+##*==++</tspan><tspan fill="#1e2438">----------------------------</tspan></text>
    <text x="26" y="159.6"><tspan fill="#1e2438">-------</tspan><tspan fill="url(#faceGradDark)">*+++==</tspan><tspan fill="#1e2438">---</tspan><tspan fill="url(#faceGradDark)">=+*++==</tspan><tspan fill="#1e2438">-----------------------------</tspan></text>
    <text x="26" y="169.4"><tspan fill="#1e2438">------</tspan><tspan fill="url(#faceGradDark)">++=======++</tspan><tspan fill="#1e2438">-----------------------------------</tspan></text>
    <text x="26" y="179.2"><tspan fill="#1e2438">------</tspan><tspan fill="url(#faceGradDark)">==========+</tspan><tspan fill="#1e2438">----------------</tspan><tspan fill="url(#faceGradDark)">+</tspan><tspan fill="#1e2438">-:----------------</tspan></text>
    <text x="26" y="189.0"><tspan fill="#1e2438">------</tspan><tspan fill="url(#faceGradDark)">==========+</tspan><tspan fill="#1e2438">----------------</tspan><tspan fill="url(#faceGradDark)">+=</tspan><tspan fill="#1e2438">-:---------------</tspan></text>
    <text x="26" y="198.8"><tspan fill="#1e2438">------</tspan><tspan fill="url(#faceGradDark)">=======++</tspan><tspan fill="#1e2438">------------------</tspan><tspan fill="url(#faceGradDark)">=</tspan><tspan fill="#1e2438">-</tspan><tspan fill="url(#faceGradDark)">+</tspan><tspan fill="#1e2438">:---------------</tspan></text>
    <text x="26" y="208.6"><tspan fill="#1e2438">-------</tspan><tspan fill="url(#faceGradDark)">=======*#%#+</tspan><tspan fill="#1e2438">:-------------</tspan><tspan fill="url(#faceGradDark)">+</tspan><tspan fill="#1e2438">-</tspan><tspan fill="url(#faceGradDark)">+</tspan><tspan fill="#1e2438">:---------------</tspan></text>
    <text x="26" y="218.4"><tspan fill="#1e2438">-------</tspan><tspan fill="url(#faceGradDark)">=====*%%@%#+</tspan><tspan fill="#1e2438">-------------</tspan><tspan fill="url(#faceGradDark)">+</tspan><tspan fill="#1e2438">-</tspan><tspan fill="url(#faceGradDark)">+</tspan><tspan fill="#1e2438">:----------------</tspan></text>
    <text x="26" y="228.2"><tspan fill="#1e2438">-------</tspan><tspan fill="url(#faceGradDark)">===</tspan><tspan fill="#1e2438">-</tspan><tspan fill="url(#faceGradDark)">*%%%%*+</tspan><tspan fill="#1e2438">--------------</tspan><tspan fill="url(#faceGradDark)">=</tspan><tspan fill="#1e2438">-</tspan><tspan fill="url(#faceGradDark)">+</tspan><tspan fill="#1e2438">:----------------</tspan></text>
    <text x="26" y="238.0"><tspan fill="#1e2438">-------</tspan><tspan fill="url(#faceGradDark)">++=*%%%%%##=</tspan><tspan fill="#1e2438">-</tspan><tspan fill="url(#faceGradDark)">==</tspan><tspan fill="#1e2438">:-----------------------------</tspan></text>
    <text x="26" y="247.8"><tspan fill="#1e2438">--------</tspan><tspan fill="url(#faceGradDark)">++*+*#%#====++=</tspan><tspan fill="#1e2438">-----------------------------</tspan></text>
    <text x="26" y="257.6"><tspan fill="#1e2438">---------</tspan><tspan fill="url(#faceGradDark)">*++++*##*=====</tspan><tspan fill="#1e2438">-----------------------------</tspan></text>
    <text x="26" y="267.4"><tspan fill="#1e2438">----------</tspan><tspan fill="url(#faceGradDark)">*++++%#=====</tspan><tspan fill="#1e2438">------------------------------</tspan></text>
    <text x="26" y="277.2"><tspan fill="#1e2438">-----------</tspan><tspan fill="url(#faceGradDark)">++++*#+==</tspan><tspan fill="#1e2438">--------------------------------</tspan></text>
    <text x="26" y="287.0"><tspan fill="#1e2438">------------</tspan><tspan fill="url(#faceGradDark)">%#*+**+++=</tspan><tspan fill="#1e2438">-</tspan><tspan fill="url(#faceGradDark)">+</tspan><tspan fill="#1e2438">----------------------------</tspan></text>
    <text x="26" y="296.8"><tspan fill="#1e2438">------------</tspan><tspan fill="url(#faceGradDark)">+@%*++##%%###++=</tspan><tspan fill="#1e2438">------------------------</tspan></text>
    <text x="26" y="306.6"><tspan fill="#1e2438">-----------</tspan><tspan fill="url(#faceGradDark)">+@#++##%%%###++=</tspan><tspan fill="#1e2438">-------------------------</tspan></text>
    <text x="26" y="316.4"><tspan fill="#1e2438">----------</tspan><tspan fill="url(#faceGradDark)">+@@#+##%%%%%###*==</tspan><tspan fill="#1e2438">------------------------</tspan></text>
    <text x="26" y="326.2"><tspan fill="#1e2438">---------</tspan><tspan fill="url(#faceGradDark)">+@@@%*##%%%%%####*==</tspan><tspan fill="#1e2438">-----------------------</tspan></text>
    </g>

    <!-- RIGHT SIDE: Terminal Window -->
    <g transform="translate(380, 26)">
      <!-- Terminal Outer Frame -->
      <rect x="0" y="0" width="588" height="308" rx="14" fill="#0d111a" stroke="#38bdf8" stroke-width="2.5" filter="url(#termGlowDark)" />
      
      <!-- Window Title Bar -->
      <path d="M 0,14 A 14,14 0 0,1 14,0 L 574,0 A 14,14 0 0,1 588,14 L 588,38 L 0,38 Z" fill="#38bdf8" />
      
      <!-- Title Bar Prompt -->
      <text x="18" y="25" font-family="'Fira Code', 'Courier New', monospace" font-size="14" font-weight="bold" fill="#0b0e14" letter-spacing="0.5">root@indoctrinatedrecluse:~</text>
      
      <!-- Window Control Buttons (Top Right) -->
      <circle cx="520" cy="19" r="6" fill="#ff5f56" />
      <circle cx="542" cy="19" r="6" fill="#ffbd2e" />
      <circle cx="564" cy="19" r="6" fill="#27c93f" />

      <!-- Terminal Body Content -->
      <g class="term-text">
        <!-- Line 1: Name -->
        <g transform="translate(26, 76)">
          <text x="0" y="0" fill="#c0caf5">&gt; Name:</text>
          <text x="100" y="0" fill="#ff79c6">Abhishek Mitra</text>
        </g>
        
        <!-- Line 2: Alias -->
        <g transform="translate(26, 120)">
          <text x="0" y="0" fill="#c0caf5">&gt; Alias:</text>
          <a href="https://github.com/indoctrinatedrecluse" target="_blank" rel="noopener noreferrer" class="term-link">
            <text x="100" y="0" fill="#bb9af3">indoctrinatedrecluse</text>
          </a>
        </g>
        
        <!-- Line 3: Degree -->
        <g transform="translate(26, 164)">
          <text x="0" y="0" fill="#c0caf5">&gt; Degree:</text>
          <text x="105" y="0" fill="#38bdf8">MSCS</text>
        </g>
        
        <!-- Line 4: Development -->
        <g transform="translate(26, 208)">
          <text x="0" y="0" fill="#c0caf5">&gt; Development:</text>
          <text x="165" y="0" fill="#4ade80">Full Stack</text>
        </g>
        
        <!-- Line 5: University -->
        <g transform="translate(26, 252)">
          <text x="0" y="0" fill="#c0caf5">&gt; University:</text>
          <a href="https://www.usc.edu" target="_blank" rel="noopener noreferrer" class="term-link">
            <text x="155" y="0" fill="#facc15">USC</text>
          </a>
        </g>

        <!-- Line 6: Blinking Terminal Cursor -->
        <g transform="translate(26, 282)">
          <text x="0" y="0" fill="#c0caf5">&gt;</text>
          <rect x="20" y="-14" width="10" height="18" fill="#38bdf8" rx="2">
            <animate attributeName="opacity" values="1;0.1;1" dur="1s" repeatCount="indefinite" />
          </rect>
        </g>
      </g>
    </g>

    <!-- Animated Cyber Scanline -->
    <rect x="10" y="10" width="980" height="2" fill="url(#scanlineGrad)" opacity="0.85" filter="url(#frameGlow)">
      <animate attributeName="y" values="10;346;10" dur="7s" repeatCount="indefinite" />
    </rect>
  </g>

  <!-- Glowing Outer Frame -->
  <rect x="10" y="10" width="980" height="340" rx="20" fill="none" stroke="url(#neonFrame)" stroke-width="3.5" filter="url(#frameGlow)" />
  <rect x="10" y="10" width="980" height="340" rx="20" fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="1" />
</svg>
