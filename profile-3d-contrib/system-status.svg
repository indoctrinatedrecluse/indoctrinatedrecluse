<svg width="660" height="224" viewBox="0 0 660 224" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    .title {
      font-family: 'Fira Code', 'Courier New', monospace;
      font-size: 16px;
      font-weight: bold;
      fill: #c0267f;
    }
    .subtitle {
      font-family: 'Fira Code', 'Courier New', monospace;
      font-size: 9px;
      fill: #5e6380;
      letter-spacing: 2px;
    }
    .row-label {
      font-family: 'Fira Code', 'Courier New', monospace;
      font-size: 11px;
      fill: #5865b0;
    }
    .row-status {
      font-family: 'Fira Code', 'Courier New', monospace;
      font-size: 9px;
      font-weight: bold;
      letter-spacing: 1px;
    }
    .ticker {
      font-family: 'Fira Code', 'Courier New', monospace;
      font-size: 10px;
      fill: #c0267f;
    }
    .bg {
      fill: #f6f3fd;
      stroke: #6d79b5;
      stroke-width: 2;
      rx: 12px;
    }
  </style>

  <rect width="660" height="224" class="bg" />

  <!-- Header -->
  <g transform="translate(24, 24)">
    <rect x="0" y="0" width="6" height="22" fill="#0277bd" rx="2" />
    <text x="18" y="16" class="title">SYSTEM STATUS</text>
    <text x="18" y="29" class="subtitle">UPTIME MONITOR // ALL SYSTEMS NOMINAL</text>
  </g>

  <!-- Scanline -->
  <rect x="-120" y="60" width="120" height="2" fill="#c0267f" opacity="0.7">
    <animate attributeName="x" values="-120;720" dur="3.2s" repeatCount="indefinite" />
  </rect>
  <line x1="24" y1="74" x2="636" y2="74" stroke="#6d79b5" stroke-opacity="0.6" stroke-width="1" />

  
    <g>
      <text x="30" y="100" class="row-label">UPLINK // API</text>
      <text x="608" y="100" text-anchor="end" class="row-status" fill="#0277bd">ONLINE</text>
      <circle cx="626" cy="96" r="3" fill="#0277bd">
        <animate attributeName="opacity" values="1;0.15;1" keyTimes="0;0.5;1" dur="2.4s" begin="0.00s" repeatCount="indefinite" />
      </circle>
    </g>
    <g>
      <text x="30" y="124" class="row-label">CONTRIBUTION MATRIX</text>
      <text x="608" y="124" text-anchor="end" class="row-status" fill="#7c3aed">SYNCED</text>
      <circle cx="626" cy="120" r="3" fill="#7c3aed">
        <animate attributeName="opacity" values="1;0.15;1" keyTimes="0;0.5;1" dur="2.4s" begin="0.30s" repeatCount="indefinite" />
      </circle>
    </g>
    <g>
      <text x="30" y="148" class="row-label">LANGUAGE CORE</text>
      <text x="608" y="148" text-anchor="end" class="row-status" fill="#7c3aed">CALIBRATED</text>
      <circle cx="626" cy="144" r="3" fill="#7c3aed">
        <animate attributeName="opacity" values="1;0.15;1" keyTimes="0;0.5;1" dur="2.4s" begin="0.60s" repeatCount="indefinite" />
      </circle>
    </g>
    <g>
      <text x="30" y="172" class="row-label">STREAK ENGINE</text>
      <text x="608" y="172" text-anchor="end" class="row-status" fill="#5e6380">STANDBY</text>
      <circle cx="626" cy="168" r="3" fill="#5e6380">
        <animate attributeName="opacity" values="1;0.15;1" keyTimes="0;0.5;1" dur="0.9s" begin="0.90s" repeatCount="indefinite" />
      </circle>
    </g>
    <g>
      <text x="30" y="196" class="row-label">PROFILE TELEMETRY</text>
      <text x="608" y="196" text-anchor="end" class="row-status" fill="#0277bd">NOMINAL</text>
      <circle cx="626" cy="192" r="3" fill="#0277bd">
        <animate attributeName="opacity" values="1;0.15;1" keyTimes="0;0.5;1" dur="2.4s" begin="1.20s" repeatCount="indefinite" />
      </circle>
    </g>
    <g>
      <text x="30" y="220" class="row-label">NEURAL LINK</text>
      <text x="608" y="220" text-anchor="end" class="row-status" fill="#c0267f">ESTABLISHED</text>
      <circle cx="626" cy="216" r="3" fill="#c0267f">
        <animate attributeName="opacity" values="1;0.15;1" keyTimes="0;0.5;1" dur="0.9s" begin="1.50s" repeatCount="indefinite" />
      </circle>
    </g>

  <!-- Ticker footer -->
  <line x1="24" y1="254" x2="636" y2="254" stroke="#6d79b5" stroke-opacity="0.4" stroke-width="1" />
  <g transform="translate(30, 280)" class="ticker">
    <text x="0" y="0" opacity="0">
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.013889;0.305556;0.333333;1" dur="10.80s" begin="0.00s" repeatCount="indefinite" />
      UPLINK STABLE // NO INTRUSIONS DETECTED
    </text>
    <text x="0" y="0" opacity="0">
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.013889;0.305556;0.333333;1" dur="10.80s" begin="3.60s" repeatCount="indefinite" />
      MONITORING CONTRIBUTION STREAMS // ALL CLEAR
    </text>
    <text x="0" y="0" opacity="0">
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.013889;0.305556;0.333333;1" dur="10.80s" begin="7.20s" repeatCount="indefinite" />
      ALL SYSTEMS NOMINAL // AWAITING INPUT
    </text>
  </g>
</svg>
