<svg width="330" height="92" viewBox="0 0 330 92" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="tileGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <style>
    .tile-rect {
      fill: #16161e;
      stroke: #3d59a1;
      stroke-width: 1.5;
      rx: 10px;
    }
    .tile-title {
      font-family: 'Fira Code', 'Courier New', monospace;
      font-size: 13px;
      font-weight: bold;
      fill: #c0caf5;
    }
    .tile-desc {
      font-family: 'Fira Code', 'Courier New', monospace;
      font-size: 9px;
      fill: #7aa2f7;
    }
    .tag-text {
      font-family: 'Fira Code', 'Courier New', monospace;
      font-size: 8px;
      font-weight: bold;
    }
  </style>

  <rect x="2" y="2" width="326" height="88" rx="10" fill="#38bdf8" opacity="0.12" filter="url(#tileGlow)" />
  <rect x="2" y="2" width="326" height="88" class="tile-rect" />
  
  <rect x="2" y="16" width="3" height="60" rx="1.5" fill="#38bdf8" />
  <circle cx="20" cy="24" r="3.5" fill="#38bdf8" />
  
  <text x="32" y="28" class="tile-title">algo-visualizer</text>
  
  <rect x="268" y="16" width="46" height="15" rx="3" fill="#1a1b26" stroke="#3d59a1" stroke-width="1" />
  <text x="291" y="27" text-anchor="middle" font-family="'Fira Code', monospace" font-size="8" fill="#ff79c6">PINNED</text>
  
  <text x="20" y="50" class="tile-desc">curated system repository // no telemetry …</text>
  
  <rect x="20" y="68" width="6" height="6" rx="1.5" fill="#38bdf8" />
  <text x="31" y="74" class="tag-text" fill="#38bdf8">PYTHON</text>
  <text x="312" y="74" text-anchor="end" class="tag-text" fill="#fbbf24">★ 0  ⑂ 0</text>
</svg>
