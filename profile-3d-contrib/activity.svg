<svg width="660" height="250" viewBox="0 0 660 250" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    .title {
      font-family: 'Fira Code', 'Courier New', monospace;
      font-size: 16px;
      font-weight: bold;
      fill: #c0267f;
    }
    .subtitle {
      font-family: 'Fira Code', 'Courier New', monospace;
      font-size: 9px;
      fill: #5e6380;
      letter-spacing: 2px;
    }
    .tag {
      font-family: 'Fira Code', 'Courier New', monospace;
      font-size: 9px;
      font-weight: bold;
      letter-spacing: 1px;
    }
    .repo {
      font-family: 'Fira Code', 'Courier New', monospace;
      font-size: 12px;
      fill: #1e2335;
      font-weight: bold;
    }
    .msg {
      font-family: 'Fira Code', 'Courier New', monospace;
      font-size: 10px;
      fill: #5865b0;
    }
    .time {
      font-family: 'Fira Code', 'Courier New', monospace;
      font-size: 10px;
      fill: #5e6380;
    }
    .empty {
      font-family: 'Fira Code', 'Courier New', monospace;
      font-size: 12px;
      fill: #5e6380;
    }
    .bg {
      fill: #f6f3fd;
      stroke: #6d79b5;
      stroke-width: 2;
      rx: 12px;
    }
  </style>

  <rect width="660" height="250" class="bg" />

  <g transform="translate(24, 24)">
    <rect x="0" y="0" width="6" height="22" fill="#0277bd" rx="2" />
    <text x="18" y="16" class="title">LIVE FEED: RECENT ACTIVITY</text>
    <text x="18" y="29" class="subtitle">LAST PUBLIC SIGNALS // GITHUB EVENTS API</text>
  </g>
  <line x1="24" y1="64" x2="636" y2="64" stroke="#6d79b5" stroke-opacity="0.6" stroke-width="1" />
  
    <g>
      <text x="24" y="84" class="tag" fill="#0277bd">[PUSH]</text>
      <text x="106" y="84" class="repo">RecluseEdit</text>
      <text x="236" y="84" class="msg">1 commits</text>
      <text x="636" y="84" class="time" text-anchor="end">1d</text>
    </g>
    <g>
      <text x="24" y="114" class="tag" fill="#0277bd">[PUSH]</text>
      <text x="106" y="114" class="repo">indoctrinatedrecluse</text>
      <text x="236" y="114" class="msg">1 commits</text>
      <text x="636" y="114" class="time" text-anchor="end">3h</text>
    </g>
    <g>
      <text x="24" y="144" class="tag" fill="#15803d">[CREATE]</text>
      <text x="106" y="144" class="repo">RecluseEdit</text>
      <text x="236" y="144" class="msg">master</text>
      <text x="636" y="144" class="time" text-anchor="end">1d</text>
    </g>
    <g>
      <text x="24" y="174" class="tag" fill="#dc2626">[DELETE]</text>
      <text x="106" y="174" class="repo">RecluseEdit</text>
      <text x="236" y="174" class="msg">tag</text>
      <text x="636" y="174" class="time" text-anchor="end">17h</text>
    </g>
    <g>
      <text x="24" y="204" class="tag" fill="#b45309">[STAR]</text>
      <text x="106" y="204" class="repo">bug-bundler</text>
      <text x="236" y="204" class="msg">starred repository</text>
      <text x="636" y="204" class="time" text-anchor="end">1d</text>
    </g>
    <g>
      <text x="24" y="234" class="tag" fill="#b45309">[STAR]</text>
      <text x="106" y="234" class="repo">RecluseEdit</text>
      <text x="236" y="234" class="msg">starred repository</text>
      <text x="636" y="234" class="time" text-anchor="end">1d</text>
    </g>
</svg>
