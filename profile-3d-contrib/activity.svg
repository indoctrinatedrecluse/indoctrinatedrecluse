<svg width="660" height="250" viewBox="0 0 660 250" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    .title {
      font-family: 'Fira Code', 'Courier New', monospace;
      font-size: 16px;
      font-weight: bold;
      fill: #ff79c6;
    }
    .subtitle {
      font-family: 'Fira Code', 'Courier New', monospace;
      font-size: 9px;
      fill: #6272a4;
      letter-spacing: 2px;
    }
    .tag {
      font-family: 'Fira Code', 'Courier New', monospace;
      font-size: 9px;
      font-weight: bold;
      letter-spacing: 1px;
    }
    .repo {
      font-family: 'Fira Code', 'Courier New', monospace;
      font-size: 12px;
      fill: #c0caf5;
      font-weight: bold;
    }
    .msg {
      font-family: 'Fira Code', 'Courier New', monospace;
      font-size: 10px;
      fill: #7aa2f7;
    }
    .time {
      font-family: 'Fira Code', 'Courier New', monospace;
      font-size: 10px;
      fill: #6272a4;
    }
    .empty {
      font-family: 'Fira Code', 'Courier New', monospace;
      font-size: 12px;
      fill: #6272a4;
    }
    .bg {
      fill: #1a1b26;
      stroke: #3d59a1;
      stroke-width: 2;
      rx: 12px;
    }
  </style>

  <rect width="660" height="250" class="bg" />

  <g transform="translate(24, 24)">
    <rect x="0" y="0" width="6" height="22" fill="#38bdf8" rx="2" />
    <text x="18" y="16" class="title">LIVE FEED: RECENT ACTIVITY</text>
    <text x="18" y="29" class="subtitle">LAST PUBLIC SIGNALS // GITHUB EVENTS API</text>
  </g>
  <line x1="24" y1="64" x2="636" y2="64" stroke="#3d59a1" stroke-opacity="0.6" stroke-width="1" />
  
    <g>
      <text x="24" y="84" class="tag" fill="#38bdf8">[PUSH]</text>
      <text x="106" y="84" class="repo">indoctrinatedrecluse</text>
      <text x="236" y="84" class="msg">1 commits</text>
      <text x="636" y="84" class="time" text-anchor="end">5m</text>
    </g>
    <g>
      <text x="24" y="114" class="tag" fill="#38bdf8">[PUSH]</text>
      <text x="106" y="114" class="repo">hellfire</text>
      <text x="236" y="114" class="msg">1 commits</text>
      <text x="636" y="114" class="time" text-anchor="end">2d</text>
    </g>
    <g>
      <text x="24" y="144" class="tag" fill="#38bdf8">[PUSH]</text>
      <text x="106" y="144" class="repo">MusicLink</text>
      <text x="236" y="144" class="msg">1 commits</text>
      <text x="636" y="144" class="time" text-anchor="end">8h</text>
    </g>
    <g>
      <text x="24" y="174" class="tag" fill="#4ade80">[CREATE]</text>
      <text x="106" y="174" class="repo">hellfire</text>
      <text x="236" y="174" class="msg">main</text>
      <text x="636" y="174" class="time" text-anchor="end">3d</text>
    </g>
    <g>
      <text x="24" y="204" class="tag" fill="#38bdf8">[PUSH]</text>
      <text x="106" y="204" class="repo">Suzerain-save-editor</text>
      <text x="236" y="204" class="msg">1 commits</text>
      <text x="636" y="204" class="time" text-anchor="end">1d</text>
    </g>
    <g>
      <text x="24" y="234" class="tag" fill="#f87171">[DELETE]</text>
      <text x="106" y="234" class="repo">hellfire</text>
      <text x="236" y="234" class="msg">tag</text>
      <text x="636" y="234" class="time" text-anchor="end">1d</text>
    </g>
</svg>
