<svg width="980" height="150" viewBox="0 0 980 150" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    a {
      cursor: pointer;
      text-decoration: none;
    }
    .cell-hover {
      transition: fill-opacity 0.2s, stroke 0.2s;
      stroke: transparent;
      stroke-width: 1;
    }
    a:hover .cell-hover {
      fill-opacity: 0.8;
      stroke: #38bdf8;
    }
    a:hover .cell-value {
      fill: #ff79c6;
    }
    .title {
      font-family: 'Fira Code', 'Courier New', monospace;
      font-size: 17px;
      font-weight: bold;
      fill: #ff79c6;
    }
    .subtitle {
      font-family: 'Fira Code', 'Courier New', monospace;
      font-size: 10px;
      fill: #6272a4;
      letter-spacing: 2px;
    }
    .cell-label {
      font-family: 'Fira Code', 'Courier New', monospace;
      font-size: 10px;
      fill: #7aa2f7;
      letter-spacing: 1.5px;
    }
    .cell-value {
      font-family: 'Fira Code', 'Courier New', monospace;
      font-size: 26px;
      font-weight: bold;
      fill: #38bdf8;
    }
    .bg {
      fill: #1a1b26;
      stroke: #3d59a1;
      stroke-width: 2;
      rx: 14px;
    }
  </style>

  <defs>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Panel -->
  <rect width="980" height="150" class="bg" />

  <!-- Header Section -->
  <g transform="translate(28, 26)">
    <rect x="0" y="0" width="6" height="22" fill="#38bdf8" rx="2" filter="url(#glow)" />
    <text x="18" y="17" class="title">SYSTEM CORE: PROFILE TELEMETRY</text>
    <text x="18" y="31" class="subtitle">LIVE ACCOUNT SIGNALS // AUTOMATED DAILY SYNC</text>
  </g>
  <line x1="28" y1="68" x2="952" y2="68" stroke="#3d59a1" stroke-opacity="0.6" stroke-width="1" />

  <!-- Metric Cells -->
  
    <a href="https://github.com/indoctrinatedrecluse?tab=followers" target="_blank" rel="noopener noreferrer">
      <rect x="32.0" y="78" width="146.0" height="62" rx="8" fill="#16161e" fill-opacity="0.3" class="cell-hover" />
      <text x="105.0" y="104" text-anchor="middle" class="cell-label">FOLLOWERS</text>
      <text x="105.0" y="132" text-anchor="middle" class="cell-value" filter="url(#glow)">6</text>
    </a>
    <a href="https://github.com/indoctrinatedrecluse?tab=following" target="_blank" rel="noopener noreferrer">
      <rect x="186.0" y="78" width="146.0" height="62" rx="8" fill="#16161e" fill-opacity="0.3" class="cell-hover" />
      <text x="259.0" y="104" text-anchor="middle" class="cell-label">FOLLOWING</text>
      <text x="259.0" y="132" text-anchor="middle" class="cell-value" filter="url(#glow)">5</text>
    </a>
    <a href="https://github.com/indoctrinatedrecluse?tab=repositories" target="_blank" rel="noopener noreferrer">
      <rect x="340.0" y="78" width="146.0" height="62" rx="8" fill="#16161e" fill-opacity="0.3" class="cell-hover" />
      <text x="413.0" y="104" text-anchor="middle" class="cell-label">PROJECTS</text>
      <text x="413.0" y="132" text-anchor="middle" class="cell-value" filter="url(#glow)">49</text>
    </a>
    <a href="https://github.com/indoctrinatedrecluse?tab=repositories&amp;q=&amp;type=&amp;language=&amp;sort=stargazers" target="_blank" rel="noopener noreferrer">
      <rect x="494.0" y="78" width="146.0" height="62" rx="8" fill="#16161e" fill-opacity="0.3" class="cell-hover" />
      <text x="567.0" y="104" text-anchor="middle" class="cell-label">TOTAL STARS</text>
      <text x="567.0" y="132" text-anchor="middle" class="cell-value" filter="url(#glow)">8</text>
    </a>
    <a href="https://github.com/indoctrinatedrecluse?tab=repositories" target="_blank" rel="noopener noreferrer">
      <rect x="648.0" y="78" width="146.0" height="62" rx="8" fill="#16161e" fill-opacity="0.3" class="cell-hover" />
      <text x="721.0" y="104" text-anchor="middle" class="cell-label">TOTAL FORKS</text>
      <text x="721.0" y="132" text-anchor="middle" class="cell-value" filter="url(#glow)">5</text>
    </a>
    <a href="https://github.com/indoctrinatedrecluse" target="_blank" rel="noopener noreferrer">
      <rect x="802.0" y="78" width="146.0" height="62" rx="8" fill="#16161e" fill-opacity="0.3" class="cell-hover" />
      <text x="875.0" y="104" text-anchor="middle" class="cell-label">MEMBER SINCE</text>
      <text x="875.0" y="132" text-anchor="middle" class="cell-value" filter="url(#glow)">2021</text>
    </a>
</svg>
