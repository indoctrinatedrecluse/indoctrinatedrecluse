<svg width="330" height="92" viewBox="0 0 330 92" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="tileGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <style>
    .tile-rect {
      fill: #e8e4f6;
      stroke: #6d79b5;
      stroke-width: 1.5;
      rx: 10px;
    }
    .tile-title {
      font-family: 'Fira Code', 'Courier New', monospace;
      font-size: 13px;
      font-weight: bold;
      fill: #1e2335;
    }
    .tile-desc {
      font-family: 'Fira Code', 'Courier New', monospace;
      font-size: 9px;
      fill: #5865b0;
    }
    .tag-text {
      font-family: 'Fira Code', 'Courier New', monospace;
      font-size: 8px;
      font-weight: bold;
    }
  </style>

  <rect x="2" y="2" width="326" height="88" rx="10" fill="#a16207" opacity="0.12" filter="url(#tileGlow)" />
  <rect x="2" y="2" width="326" height="88" class="tile-rect" />
  
  <rect x="2" y="16" width="3" height="60" rx="1.5" fill="#a16207" />
  <circle cx="20" cy="24" r="3.5" fill="#a16207" />
  
  <text x="32" y="28" class="tile-title">portfolio-react-nextjs</text>
  
  <rect x="262" y="16" width="52" height="15" rx="3" fill="#f6f3fd" stroke="#6d79b5" stroke-width="1" />
  <text x="288" y="27" text-anchor="middle" font-family="'Fira Code', monospace" font-size="8" fill="#0277bd">FEATURED</text>
  
  <text x="20" y="50" class="tile-desc">no description logged</text>
  
  <rect x="20" y="68" width="6" height="6" rx="1.5" fill="#a16207" />
  <text x="31" y="74" class="tag-text" fill="#a16207">JAVASCRIPT</text>
  <text x="312" y="74" text-anchor="end" class="tag-text" fill="#b45309">★ 1 | FORKS 0</text>
</svg>
