  <rect width="720" height="236" class="bg" />

  <g transform="translate(24, 24)">
    <rect x="0" y="0" width="6" height="22" fill="#38bdf8" rx="2" />
    <text x="18" y="16" class="title">COMMIT GRID // LAST 365 DAYS</text>
    <text x="18" y="29" class="subtitle">CONTRIBUTION TELEMETRY // GITHUB GRAPHQL</text>
  </g>
  <text x="696" y="42" class="total">SYNC PENDING</text>
  
  <rect x="24" y="92" width="672" height="112" rx="10" fill="none" stroke="#3d59a1" stroke-width="1.5" stroke-dasharray="6 5" />
  
  <text x="696" y="222" class="foot" text-anchor="end">RUN DASHBOARD WORKFLOW TO INITIALIZE GRID</text>
