<svg width="720" height="236" viewBox="0 0 720 236" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    .title {
      font-family: 'Fira Code', 'Courier New', monospace;
      font-size: 16px;
      font-weight: bold;
      fill: #ff79c6;
    }
    .subtitle {
      font-family: 'Fira Code', 'Courier New', monospace;
      font-size: 9px;
      fill: #6272a4;
      letter-spacing: 2px;
    }
    .total {
      font-family: 'Fira Code', 'Courier New', monospace;
      font-size: 12px;
      font-weight: bold;
      fill: #38bdf8;
      text-anchor: end;
    }
    .foot {
