<svg width="660" height="250" viewBox="0 0 660 250" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    a {
      cursor: pointer;
      text-decoration: none;
    }
    .activity-row text.repo {
      transition: fill 0.2s;
    }
    a:hover .activity-row text.repo {
      fill: #c0267f;
    }
    .title {
      font-family: 'Fira Code', 'Courier New', monospace;
      font-size: 16px;
      font-weight: bold;
      fill: #c0267f;
    }
    .subtitle {
      font-family: 'Fira Code', 'Courier New', monospace;
      font-size: 9px;
      fill: #5e6380;
      letter-spacing: 2px;
    }
    .tag {
      font-family: 'Fira Code', 'Courier New', monospace;
      font-size: 9px;
      font-weight: bold;
      letter-spacing: 1px;
    }
    .repo {
      font-family: 'Fira Code', 'Courier New', monospace;
      font-size: 12px;
      fill: #1e2335;
      font-weight: bold;
    }
    .msg {
      font-family: 'Fira Code', 'Courier New', monospace;
      font-size: 10px;
      fill: #5865b0;
    }
    .time {
      font-family: 'Fira Code', 'Courier New', monospace;
      font-size: 10px;
      fill: #5e6380;
    }
    .empty {
      font-family: 'Fira Code', 'Courier New', monospace;
      font-size: 12px;
      fill: #5e6380;
    }
    .bg {
      fill: #f6f3fd;
      stroke: #6d79b5;
      stroke-width: 2;
      rx: 12px;
    }
  </style>

  <rect width="660" height="250" class="bg" />

  <g transform="translate(24, 24)">
    <rect x="0" y="0" width="6" height="22" fill="#0277bd" rx="2" />
    <text x="18" y="16" class="title">LIVE FEED: RECENT ACTIVITY</text>
    <text x="18" y="29" class="subtitle">LAST PUBLIC SIGNALS // GITHUB EVENTS API</text>
  </g>
  <line x1="24" y1="64" x2="636" y2="64" stroke="#6d79b5" stroke-opacity="0.6" stroke-width="1" />
  
    <a href="https://github.com/indoctrinatedrecluse/Selene" target="_blank" rel="noopener noreferrer">
      <g class="activity-row">
        <text x="24" y="86" class="tag" fill="#0277bd">[PUSH]</text>
        <text x="106" y="86" class="repo">Selene</text>
        <text x="236" y="86" class="msg">1 commits</text>
        <text x="636" y="86" class="time" text-anchor="end">16h</text>
      </g>
    </a>
    <a href="https://github.com/indoctrinatedrecluse/Mimir" target="_blank" rel="noopener noreferrer">
      <g class="activity-row">
        <text x="24" y="114" class="tag" fill="#0277bd">[PUSH]</text>
        <text x="106" y="114" class="repo">Mimir</text>
        <text x="236" y="114" class="msg">1 commits</text>
        <text x="636" y="114" class="time" text-anchor="end">7h</text>
      </g>
    </a>
    <a href="https://github.com/indoctrinatedrecluse/Selene" target="_blank" rel="noopener noreferrer">
      <g class="activity-row">
        <text x="24" y="142" class="tag" fill="#dc2626">[DELETE]</text>
        <text x="106" y="142" class="repo">Selene</text>
        <text x="236" y="142" class="msg">tag</text>
        <text x="636" y="142" class="time" text-anchor="end">2d</text>
      </g>
    </a>
    <a href="https://github.com/indoctrinatedrecluse/Jormungandr" target="_blank" rel="noopener noreferrer">
      <g class="activity-row">
        <text x="24" y="170" class="tag" fill="#0277bd">[PUSH]</text>
        <text x="106" y="170" class="repo">Jormungandr</text>
        <text x="236" y="170" class="msg">1 commits</text>
        <text x="636" y="170" class="time" text-anchor="end">4d</text>
      </g>
    </a>
    <a href="https://github.com/indoctrinatedrecluse/Selene" target="_blank" rel="noopener noreferrer">
      <g class="activity-row">
        <text x="24" y="198" class="tag" fill="#15803d">[CREATE]</text>
        <text x="106" y="198" class="repo">Selene</text>
        <text x="236" y="198" class="msg">main</text>
        <text x="636" y="198" class="time" text-anchor="end">3d</text>
      </g>
    </a>
    <a href="https://github.com/indoctrinatedrecluse/indoctrinatedrecluse" target="_blank" rel="noopener noreferrer">
      <g class="activity-row">
        <text x="24" y="226" class="tag" fill="#0277bd">[PUSH]</text>
        <text x="106" y="226" class="repo">indoctrinatedrecluse</text>
        <text x="236" y="226" class="msg">1 commits</text>
        <text x="636" y="226" class="time" text-anchor="end">3d</text>
      </g>
    </a>
</svg>
